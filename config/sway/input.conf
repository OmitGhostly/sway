# Keyboard and touchpad: yours to edit (sway reads this file at start and on reload; SUPER+SHIFT+C reloads).
# The mouse speed and acceleration from Settings > Mouse & touchpad go to mouse.conf instead.
input type:keyboard {
    xkb_layout us
    xkb_options grp:alt_shift_toggle
    repeat_delay 300
    repeat_rate 50
    xkb_numlock enabled
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
